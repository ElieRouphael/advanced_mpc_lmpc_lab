[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-mpc-lmpc-lab"
version = "0.2.0"
description = "Educational constrained MPC and Learning MPC laboratory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter>=1.0", "nbformat>=5.9", "nbconvert>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
